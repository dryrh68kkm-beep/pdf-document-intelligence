name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-tests:
    name: Unit + API tests (no real OCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[ocr,api,dev]"

      - name: Run unit + API tests
        run: python -m pytest tests/unit tests/integration/test_api.py tests/integration/test_divisions_api.py -q

  synthetic-regression:
    name: Synthetic Big C + BPDC + persistence + real OCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install Tesseract OCR and test fonts (Thai + English)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-tha fonts-noto-core fontconfig

      - name: Install dependencies
        run: pip install -e ".[ocr,api,dev]"

      - name: Run synthetic regression + persistence + real OCR
        run: python -m pytest tests/integration/test_persistence_flow.py tests/integration/test_synthetic_regression.py -q
