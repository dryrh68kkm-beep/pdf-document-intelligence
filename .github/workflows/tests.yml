name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-tests:
    name: Unit + API tests (no real OCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[ocr,api,dev]"

      # tests/unit and tests/integration/test_api.py deliberately avoid
      # invoking real OCR (test_api.py's own docstring: "these just confirm
      # the FastAPI app boots, routes correctly... not extraction
      # correctness") - no tesseract binary needed for this job, so it
      # stays fast and gives PRs a quick pass/fail signal.
      - name: Run unit + API tests
        run: python -m pytest tests/unit tests/integration/test_api.py tests/integration/test_divisions_api.py -q

  golden-regression:
    name: Golden regression + full persistence flow (real OCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install Tesseract OCR (Thai + English)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-tha

      - name: Install dependencies
        run: pip install -e ".[ocr,api,dev]"

      # Separated from fast-tests (spec requirement: don't let the real-OCR
      # golden regression suite make every PR wait on it as a single
      # sequential job) - runs in parallel with fast-tests instead, at the
      # cost of the apt-get + full OCR pipeline time (~4-5 minutes).
      - name: Run golden regression + real-OCR integration tests
        run: python -m pytest tests/integration/test_persistence_flow.py tests/integration/test_golden_regression.py tests/integration/test_golden_regression_bpdc.py -q

  windows-e2e:
    name: Windows smoke/E2E
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[ocr,api,dev]"

      # Required: chocolatey's tesseract package ships the binary reliably
      # but not the Thai (tha) traineddata, so the language pack is fetched
      # separately below. No continue-on-error - a failed install must
      # fail the job now that Windows Thai OCR is a required gate.
      - name: Install Tesseract OCR for Windows
        run: choco install tesseract --no-progress -y

      # Required: chocolatey's tesseract package does not reliably ship
      # tha.traineddata, so it is fetched deterministically straight from
      # the official tesseract-ocr/tessdata_fast repo and dropped into
      # Tesseract's own tessdata directory. No continue-on-error - a
      # failed/truncated download must fail the job, not silently leave
      # Windows OCR English-only.
      - name: Install Thai (tha) traineddata for Windows Tesseract
        shell: pwsh
        run: |
          $tessdata = "C:\Program Files\Tesseract-OCR\tessdata"
          New-Item -ItemType Directory -Force -Path $tessdata | Out-Null
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/tha.traineddata" `
            -OutFile "$tessdata\tha.traineddata"
          if (-not (Test-Path "$tessdata\tha.traineddata")) {
            throw "tha.traineddata did not download"
          }
          $size = (Get-Item "$tessdata\tha.traineddata").Length
          if ($size -lt 100000) {
            throw "tha.traineddata looks truncated (size=$size bytes)"
          }

      # Makes the chocolatey-installed tesseract.exe visible to every
      # later step in this job (GITHUB_PATH, not just the current shell).
      - name: Add Tesseract-OCR to PATH
        shell: pwsh
        run: echo "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Lets pytesseract/tesseract find tessdata (and tha.traineddata
      # specifically) from every later step, including the app's own
      # health check, which shells out to `tesseract --list-langs`.
      - name: Set TESSDATA_PREFIX
        shell: pwsh
        run: echo "TESSDATA_PREFIX=C:\Program Files\Tesseract-OCR\tessdata" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Real assertion, not just log text: parses `tesseract --list-langs`
      # output and fails the step (not just prints a warning) if either
      # `eng` or, especially, `tha` is missing. This is the gate that
      # makes the Thai OCR test below safe to run unconditionally instead
      # of skipping.
      - name: Verify Tesseract version and language packs
        shell: pwsh
        run: |
          tesseract --version
          $langsOutput = tesseract --list-langs 2>&1 | Out-String
          Write-Host $langsOutput
          $langs = $langsOutput -split "`r?`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" }
          if ($langs -notcontains "eng") {
            throw "tesseract --list-langs did not report 'eng' as available"
          }
          if ($langs -notcontains "tha") {
            throw "tesseract --list-langs did not report 'tha' as available"
          }
          Write-Host "Confirmed both 'eng' and 'tha' language packs are available."

      # Required, blocking: boots the real server as a subprocess on
      # 127.0.0.1 (a test-local bind, distinct from run.bat's own 0.0.0.0
      # LAN default, which this job does not touch), waits for
      # /api/health, then drives it over real HTTP - root/static, a
      # runtime-generated synthetic PDF upload -> process -> persistence
      # flow, app-data/temp directory creation on an actual Windows
      # filesystem, a synthetic Master CSV import, and an exported .xlsx
      # opened back with openpyxl. No real PDF or Master data anywhere.
      - name: Run Windows smoke/E2E tests (required)
        run: python -m pytest tests/windows/test_windows_e2e.py -v

      # Required, blocking: the Thai-capable Tesseract install above is
      # verified before this step runs, so no test in this file skips
      # itself anymore - a real Thai OCR failure here is a real failure.
      - name: Run Windows real Thai OCR tests (required)
        run: python -m pytest tests/windows/test_windows_real_ocr.py -v

  concurrency-stress:
    name: Concurrency / LAN stress regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[ocr,api,dev]"

      # No real Tesseract needed - the multi-client-reads-during-processing
      # test uses the same text-layer-only synthetic PDFs as fast-tests,
      # not OCR. Isolated into its own job (spec requirement: a burst of
      # concurrent uploads/edits/reprocess races must not compete for time
      # or interfere with the other three jobs' own state).
      - name: Run concurrency / LAN stress tests
        run: python -m pytest tests/integration/test_concurrency_stress.py -v -s
