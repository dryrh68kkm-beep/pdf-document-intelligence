<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>Manifest Review</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
<style>
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --surface-alt: #e3e8ec;
    --surface-sunken: #dde3e8;
    --text: #171f2a;
    --text-muted: #566171;
    --text-faint: #8590a0;
    --border: #d2d9e0;
    --border-strong: #b9c2cc;
    --accent: #2c5f5a;
    --accent-strong: #1c4440;
    --accent-soft: #dbe8e6;
    --success: #2f8558;
    --success-soft: #e1f0e7;
    --warning: #a86a0a;
    --warning-soft: #f6e9d3;
    --critical: #b23b3b;
    --critical-soft: #f6dfdf;
    --shadow: 0 1px 2px rgba(23, 31, 42, 0.06), 0 6px 20px -8px rgba(23, 31, 42, 0.18);
    --radius: 10px;
    --font-ui: "IBM Plex Sans", "IBM Plex Sans Thai", -apple-system, sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10151c;
      --surface: #1a222c;
      --surface-alt: #212b37;
      --surface-sunken: #171f28;
      --text: #e8ecf1;
      --text-muted: #a1abba;
      --text-faint: #6d7789;
      --border: #2c3746;
      --border-strong: #3c4a5c;
      --accent: #6fb3a8;
      --accent-strong: #8fc9bf;
      --accent-soft: #1f3733;
      --success: #5cba85;
      --success-soft: #1c3327;
      --warning: #dba54c;
      --warning-soft: #3a2e17;
      --critical: #e08080;
      --critical-soft: #3a2222;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px -10px rgba(0, 0, 0, 0.55);
    }
  }

  :root[data-theme="dark"] {
    --bg: #10151c;
    --surface: #1a222c;
    --surface-alt: #212b37;
    --surface-sunken: #171f28;
    --text: #e8ecf1;
    --text-muted: #a1abba;
    --text-faint: #6d7789;
    --border: #2c3746;
    --border-strong: #3c4a5c;
    --accent: #6fb3a8;
    --accent-strong: #8fc9bf;
    --accent-soft: #1f3733;
    --success: #5cba85;
    --success-soft: #1c3327;
    --warning: #dba54c;
    --warning-soft: #3a2e17;
    --critical: #e08080;
    --critical-soft: #3a2222;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px -10px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft); }

  .app { display: flex; flex-direction: column; height: 100vh; min-height: 560px; }

  /* ---------- Top summary bar ---------- */
  .topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 20px;
    padding: 14px 22px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
    z-index: 5;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-right: 6px; }
  .brand-mark { font-size: 19px; }
  .brand-name {
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.01em;
  }
  .brand-file {
    font-family: var(--font-data);
    font-size: 12px;
    color: var(--text-muted);
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 12px 5px 10px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.01em;
    border: 1px solid transparent;
  }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .status-AUTO_APPROVED { background: var(--success-soft); color: var(--success); border-color: color-mix(in srgb, var(--success) 35%, transparent); }
  .status-AUTO_APPROVED .dot { background: var(--success); }
  .status-REVIEW_RECOMMENDED { background: var(--warning-soft); color: var(--warning); border-color: color-mix(in srgb, var(--warning) 35%, transparent); }
  .status-REVIEW_RECOMMENDED .dot { background: var(--warning); }
  .status-MANUAL_REVIEW_REQUIRED { background: var(--critical-soft); color: var(--critical); border-color: color-mix(in srgb, var(--critical) 35%, transparent); }
  .status-MANUAL_REVIEW_REQUIRED .dot { background: var(--critical); }

  .stat-row { display: flex; gap: 22px; margin-left: auto; flex-wrap: wrap; }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 64px;
  }
  .stat-value {
    font-family: var(--font-data);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: -0.02em;
  }
  .stat-value.warn { color: var(--warning); }
  .stat-value.critical { color: var(--critical); }
  .stat-value.ok { color: var(--success); }
  .stat-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
  }

  /* ---------- Split panes ---------- */
  .split { flex: 1; display: flex; min-height: 0; }
  .pane-pdf {
    width: 38%;
    min-width: 320px;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    background: var(--surface-sunken);
    border-right: 1px solid var(--border);
  }
  .pdf-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
    color: var(--text-muted);
  }
  .pdf-toolbar button {
    font-family: var(--font-ui);
    font-size: 12.5px;
    font-weight: 600;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    border-radius: 6px;
    padding: 4px 9px;
    cursor: pointer;
  }
  .pdf-toolbar button:hover { background: var(--surface-alt); }
  .pdf-toolbar button:focus-visible, a:focus-visible, .row:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .pdf-toolbar .page-indicator {
    font-family: var(--font-data);
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  .pdf-frame-wrap { flex: 1; position: relative; }
  .pdf-frame-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }

  .pane-data { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .data-scroll { flex: 1; overflow: auto; }

  .dept-header {
    position: sticky;
    top: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px;
    background: var(--accent);
    color: white;
  }
  .dept-name { font-weight: 700; font-size: 13px; letter-spacing: 0.01em; }
  .dept-meta {
    font-family: var(--font-data);
    font-size: 11.5px;
    opacity: 0.85;
    margin-left: auto;
  }
  .dept-recon {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.16);
  }

  table.rows { width: 100%; border-collapse: collapse; }
  .table-scroll { overflow-x: auto; }
  table.rows th {
    position: sticky;
    top: 33px;
    background: var(--surface-alt);
    text-align: left;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    font-weight: 600;
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.rows td {
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    white-space: nowrap;
  }
  td.name-cell { white-space: normal; max-width: 260px; min-width: 180px; }
  .row { cursor: pointer; }
  .row:hover td { background: var(--surface-alt); }
  .row.active td { background: var(--accent-soft); }
  .mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .num { text-align: right; }
  .cell-muted { color: var(--text-faint); }

  .conf-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .conf-HIGH { background: var(--success-soft); color: var(--success); }
  .conf-MEDIUM { background: var(--warning-soft); color: var(--warning); }
  .conf-LOW { background: var(--critical-soft); color: var(--critical); }
  .conf-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }

  .flag-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--warning-soft);
    color: var(--warning);
    font-size: 10px;
    font-weight: 700;
    margin-left: 6px;
    cursor: help;
    flex: none;
  }
  .name-thai { font-family: "IBM Plex Sans Thai", var(--font-ui); }

  .legend {
    display: flex;
    gap: 14px;
    align-items: center;
    padding: 8px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }
  .legend b { color: var(--text); font-weight: 600; }

  @media (prefers-reduced-motion: no-preference) {
    .row td { transition: background-color 120ms ease; }
  }
  @media (max-width: 860px) {
    .split { flex-direction: column; }
    .pane-pdf { width: 100%; max-width: none; height: 42vh; border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">📦</span>
      <span class="brand-name">Manifest Review</span>
    </div>
    <span class="brand-file" id="filename" title=""></span>
    <span class="status-pill" id="statusPill"><span class="dot"></span><span id="statusLabel"></span></span>
    <div class="stat-row" id="statRow"></div>
  </header>

  <div class="split">
    <section class="pane-pdf">
      <div class="pdf-toolbar">
        <button id="prevPage" type="button" aria-label="หน้าก่อนหน้า">‹</button>
        <span class="page-indicator"><span id="pageNum">1</span> / <span id="pageCount">1</span></span>
        <button id="nextPage" type="button" aria-label="หน้าถัดไป">›</button>
        <span class="cell-muted" style="margin-left:auto;">คลิกแถวขวาเพื่อเปิดหน้าต้นฉบับ</span>
      </div>
      <div class="pdf-frame-wrap">
        <iframe id="pdfFrame" title="เอกสารต้นฉบับ PDF"></iframe>
      </div>
    </section>

    <section class="pane-data">
      <div class="data-scroll" id="dataScroll"></div>
      <div class="legend">
        <span><span class="conf-chip conf-HIGH"><span class="dot"></span>HIGH</span> มั่นใจสูง</span>
        <span><span class="conf-chip conf-MEDIUM"><span class="dot"></span>MEDIUM</span> ควรตรวจ</span>
        <span><span class="conf-chip conf-LOW"><span class="dot"></span>LOW</span> ต้องตรวจ</span>
        <span><span class="flag-icon" aria-hidden="true">!</span> มีปัญหาที่ต้องตรวจสอบ (hover เพื่อดูเหตุผล)</span>
      </div>
    </section>
  </div>
</div>

<script>
const DATA = __DATA_JSON__;
const PDF_BASE64 = "__PDF_BASE64__";

const iframe = document.getElementById("pdfFrame");
const pdfSrcBase = "data:application/pdf;base64," + PDF_BASE64;
let currentPage = 1;

function setPage(n) {
  currentPage = Math.max(1, Math.min(DATA.pages, n));
  iframe.src = pdfSrcBase + "#page=" + currentPage + "&view=FitH";
  document.getElementById("pageNum").textContent = currentPage;
  document.querySelectorAll(".row.active").forEach(el => el.classList.remove("active"));
}

document.getElementById("pageCount").textContent = DATA.pages;
document.getElementById("prevPage").addEventListener("click", () => setPage(currentPage - 1));
document.getElementById("nextPage").addEventListener("click", () => setPage(currentPage + 1));
setPage(1);

document.getElementById("filename").textContent = DATA.filename;
document.getElementById("filename").title = DATA.filename;

const STATUS_LABEL = {
  AUTO_APPROVED: "อนุมัติอัตโนมัติ",
  REVIEW_RECOMMENDED: "แนะนำให้ตรวจสอบ",
  MANUAL_REVIEW_REQUIRED: "ต้องตรวจสอบด้วยคน",
};
const pill = document.getElementById("statusPill");
pill.classList.add("status-" + DATA.status);
document.getElementById("statusLabel").textContent =
  (STATUS_LABEL[DATA.status] || DATA.status) + " · " + DATA.confidence + "%";

const totalRows = DATA.departments.reduce((a, d) => a + d.rowCount, 0);
const reviewRows = DATA.departments.reduce(
  (a, d) => a + d.rows.filter(r => Object.values(r).some(f => f && f.review)).length, 0
);

function stat(label, value, cls) {
  const wrap = document.createElement("div");
  wrap.className = "stat";
  wrap.innerHTML =
    '<span class="stat-value' + (cls ? " " + cls : "") + '">' + value + '</span>' +
    '<span class="stat-label">' + label + '</span>';
  return wrap;
}
const statRow = document.getElementById("statRow");
statRow.appendChild(stat("แผนก", DATA.departments.length));
statRow.appendChild(stat("รายการ", totalRows));
statRow.appendChild(stat("ต้องตรวจ", reviewRows, reviewRows > 0 ? "warn" : "ok"));
statRow.appendChild(stat("Reconcile ผิดพลาด", DATA.errors, DATA.errors > 0 ? "critical" : "ok"));
statRow.appendChild(stat("Reconcile", DATA.reconciled ? "PASSED" : "FAILED", DATA.reconciled ? "ok" : "critical"));

const FLAG_LABEL = {
  TEXT_LAYER_UNRELIABLE: "ข้อความอาจผิดเพราะ text layer ต้นฉบับเสีย (สระ/วรรณยุกต์หาย) — รอ OCR ยืนยัน",
  MISSING_FIELD: "ไม่พบค่าในตำแหน่งนี้",
  TYPE_PARSE_FAILED: "แปลงชนิดข้อมูลไม่สำเร็จ",
};

function fieldFlags(row) {
  const flags = new Set();
  Object.values(row).forEach(f => {
    if (f && f.flags) f.flags.forEach(x => flags.add(x));
  });
  return [...flags];
}

function cell(field, opts) {
  opts = opts || {};
  const td = document.createElement("td");
  td.className = "mono" + (opts.name ? " name-cell name-thai" : "") + (opts.num ? " num" : "");
  const val = field.value === null || field.value === undefined || field.value === "" ? "" : field.value;
  td.textContent = val;
  if (val === "") td.classList.add("cell-muted");
  if (val === "") td.textContent = "—";
  if (field.review) {
    const icon = document.createElement("span");
    icon.className = "flag-icon";
    icon.setAttribute("aria-hidden", "true");
    icon.textContent = "!";
    icon.title = (field.flags || []).map(f => FLAG_LABEL[f] || f).join(" · ") || "ต้องตรวจสอบ";
    td.appendChild(icon);
  }
  return td;
}

const scroll = document.getElementById("dataScroll");
DATA.departments.forEach(dept => {
  const wrap = document.createElement("div");

  const header = document.createElement("div");
  header.className = "dept-header";
  const reconOk = dept.rows.length === dept.rowCount;
  header.innerHTML =
    '<span class="dept-name">' + dept.name + '</span>' +
    '<span class="dept-meta">หน้า ' + dept.pageStart + (dept.pageEnd !== dept.pageStart ? "–" + dept.pageEnd : "") + '</span>' +
    '<span class="dept-recon">' + dept.rowCount + ' รายการ</span>';
  wrap.appendChild(header);

  const tableScroll = document.createElement("div");
  tableScroll.className = "table-scroll";
  const table = document.createElement("table");
  table.className = "rows";
  table.innerHTML =
    "<thead><tr>" +
    "<th>DN</th><th>DO</th><th>Order</th><th>Line</th><th>Pallet</th><th>Lot</th>" +
    "<th>Article</th><th>Barcode</th><th>ชื่อสินค้า</th>" +
    '<th class="num">น้ำหนัก</th><th class="num">PU</th><th class="num">SKU</th><th>สถานะ</th>' +
    "</tr></thead>";
  const tbody = document.createElement("tbody");

  dept.rows.forEach(row => {
    const tr = document.createElement("tr");
    tr.className = "row";
    tr.tabIndex = 0;
    tr.appendChild(cell(row.dn_no));
    tr.appendChild(cell(row.do_no));
    tr.appendChild(cell(row.order_no));
    tr.appendChild(cell(row.line, { num: true }));
    tr.appendChild(cell(row.pallet));
    tr.appendChild(cell(row.lot));
    tr.appendChild(cell(row.article));
    tr.appendChild(cell(row.barcode));
    tr.appendChild(cell(row.name, { name: true }));
    tr.appendChild(cell(row.weight_qty, { num: true }));
    tr.appendChild(cell(row.pu_qty, { num: true }));
    tr.appendChild(cell(row.sku_qty, { num: true }));

    const statusTd = document.createElement("td");
    const chip = document.createElement("span");
    chip.className = "conf-chip conf-" + row.band;
    chip.innerHTML = '<span class="dot"></span>' + row.band;
    statusTd.appendChild(chip);
    tr.appendChild(statusTd);

    const gotoPage = () => {
      document.querySelectorAll(".row.active").forEach(el => el.classList.remove("active"));
      tr.classList.add("active");
      setPage(row.dn_no.page || 1);
      tr.classList.add("active");
    };
    tr.addEventListener("click", gotoPage);
    tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); gotoPage(); } });

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  tableScroll.appendChild(table);
  wrap.appendChild(tableScroll);
  scroll.appendChild(wrap);
});
</script>
</body>
</html>
