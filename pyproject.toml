[project]
name = "pdf-document-intelligence"
version = "0.1.0"
description = "Accuracy-first PDF document intelligence pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pikepdf>=9.0",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=2.8",
    "opencv-python-headless>=4.10",
]
api = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pdf_document_intelligence*"]
