[project]
name = "pdf-document-intelligence"
version = "0.1.0"
description = "Accuracy-first PDF document intelligence pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pikepdf>=9.0",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "pillow>=10.3",
]
api = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "httpx2",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette 1.6.0 still imports AnyIO's deprecated BlockingPortal alias.
# Upstream issue #3497/#3498 fixes it after the currently resolved release;
# filter only this exact third-party import-time warning until that release
# reaches FastAPI's dependency range.
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pdf_document_intelligence*"]
